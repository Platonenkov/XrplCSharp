[server]
port_rpc_admin_local
port_rpc_admin
port_ws_admin
port_ws_admin_auth

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_rpc_admin]
port = 5006
ip = 0.0.0.0
protocol = http
admin = 0.0.0.0

[port_ws_admin]
port = 6006
ip = 0.0.0.0
protocol = ws
admin = 0.0.0.0

# Mirrors [port_ws_admin_auth] of rippled.cfg so TestIAdminCredentials behaves the same on both stands.
[port_ws_admin_auth]
port = 6007
ip = 0.0.0.0
protocol = ws
admin = 0.0.0.0
admin_user = xrpl_admin
admin_password = xrpl_admin_secret

[node_size]
small

[node_db]
type=RocksDB
path=/var/lib/rippled/db

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/lib/rippled/debug.log

[ledger_history]
full

[validation_seed]
ssGADm7BUDmwSWgGXg6iokLGqqHer

[validators_file]
validators.txt

[amendment_majority_time]
15 minutes

[online_delete]
0

[path_search]
7

[path_search_fast]
2

[path_search_max]
10

[rpc_startup]
{ "command": "log_level", "severity": "info" }
{ "command": "feature", "feature": "AMM", "vetoed": false }
{ "command": "feature", "feature": "BatchV1_1", "vetoed": false }
{ "command": "feature", "feature": "Clawback", "vetoed": false }
{ "command": "feature", "feature": "AMMClawback", "vetoed": false }
{ "command": "feature", "feature": "TokenEscrow", "vetoed": false }
{ "command": "feature", "feature": "PermissionedDEX", "vetoed": false }
{ "command": "feature", "feature": "XChainBridge", "vetoed": false }
{ "command": "feature", "feature": "SingleAssetVault", "vetoed": false }
{ "command": "feature", "feature": "LendingProtocol", "vetoed": false }
{ "command": "feature", "feature": "MPTokensV1", "vetoed": false }
{ "command": "feature", "feature": "MPTokensV2", "vetoed": false }

[features]
# GENERATED — do not edit by hand:
#   .ci-config/generate-amendments.sh <develop-ref> .ci-config/rippled.batchv11.cfg
# The ref MUST match the xrpld build pinned in Dockerfile.nightly (ARG
# XRPLD_VERSION); a newer ref emits names the pinned binary does not know.
# [features] does not vote — it feeds Rules presets, so listed amendments act
# enabled during transaction processing even when not on-ledger. That is the
# only way to exercise Supported::No paths (MPTokensV2 here), which is why this
# list is a superset of [amendments] below. Retired amendments are baked into
# the protocol and MUST NOT be listed.
AMM
AMMClawback
BatchV1_1
ConfidentialTransfer
Credentials
DID
DeepFreeze
DynamicMPT
DynamicNFT
LendingProtocol
LendingProtocolV1_1
MPTokensV1
MPTokensV2
NFTokenMintOffer
PermissionDelegationV1_1
PermissionedDEX
PermissionedDomains
PriceOracle
SingleAssetVault
Sponsor
TokenEscrow
XChainBridge
XRPFees
fixAMMClawbackRounding
fixAMMv1_1
fixAMMv1_2
fixAMMv1_3
fixCleanup3_1_3
fixCleanup3_2_0
fixCleanup3_3_0
fixCleanup3_4_0
fixCleanup3_5_0
fixDirectoryLimit
fixEmptyDID
fixEnforceNFTokenTrustline
fixEnforceNFTokenTrustlineV2
fixFillOrKill
fixFrozenLPTokenTransfer
fixIncludeKeyletFields
fixInnerObjTemplate2
fixInvalidTxFlags
fixMPTDeliveredAmount
fixNFTokenPageLinks
fixPayChanCancelAfter
fixPreviousTxnID
fixPriceOracleOrder
fixReducedOffersV2
fixRemoveNFTokenAutoTrustLine
fixTokenEscrowV1
fixXChainRewardRounding

[network_id]
0

